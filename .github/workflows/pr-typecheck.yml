name: PR Typecheck
on:
  push:
    branches: [feat/pr19-social-essentials]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --no-package-lock --ignore-scripts
      - run: npx tsc --noEmit
      - run: node --experimental-strip-types --test tests/safe-next-path.test.mjs
